[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemm-kkt"
version = "0.1.0"
description = "GPU-first factorization-free KKT solvers with Newton-Schulz approximate inverses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "GEMM-KKT Authors" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "typing-extensions>=4.9",
  "tqdm>=4.66",
  "pandas>=2.2",
  "tabulate>=0.9"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=4.1"
]
baselines = [
  "osqp>=0.6.5",
  "highspy>=1.7.2",
  "jax>=0.4.24",
  "jaxlib>=0.4.24"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gemm_kkt*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
